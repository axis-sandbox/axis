version: 1
name: windows-mxc-strict-proxy-smoke

runtime:
  containment: process
  provider: mxc

filesystem:
  read_only: []
  read_write:
    - "{workspace}"
  deny: []
  compatibility: hard_requirement

process:
  max_processes: 0
  max_memory_mb: 0
  cpu_rate_percent: 0
  timeout_sec: 180

network:
  mode: proxy
  policies:
    - name: github-api
      endpoints:
        - host: "api.github.com"
          port: 443
