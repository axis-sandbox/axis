name: CI

on:
  push:
    branches: [main, develop, "users/**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format and clippy always run (fast, catch style issues on all changes).
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # Build and test jobs skip on docs-only changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'e2e/linux/**'
              - 'policies/**'
              - 'data/**'
              - '.github/workflows/ci.yml'

  test-linux:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit & integration tests
        run: cargo test

      - name: Seccomp notify connect attribution proof
        env:
          AXIS_TEST_SECCOMP_NOTIFY_ATTRIBUTION: "1"
        run: cargo test -p axis-sandbox gated_seccomp_notify_records_connecting_executable_before_fd_handoff_exec -- --nocapture

      - name: Standalone Linux e2e test
        run: bash e2e/linux/test_sandbox.sh ./target/release/axis

      - name: Policy validation
        run: |
          ./target/release/axis policy validate policies/minimal.yaml
          ./target/release/axis policy validate policies/coding-agent.yaml
          ./target/release/axis policy validate policies/gpu-agent.yaml

      - name: Success metrics
        run: ./target/release/success-metrics

      - name: Daemon e2e test
        run: bash e2e/linux/test_e2e_daemon.sh

      - name: Agent safety tests
        run: AXIS_BIN=./target/release/axis bash e2e/agents/test_agents.sh --platform linux

  test-linux-netns-helper:
    name: Test Linux netns helper
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install kernel namespace tooling
        run: sudo apt-get update && sudo apt-get install -y iproute2 iptables python3

      - name: Helper launch proof
        env:
          AXIS_RUN_PRIVILEGED_E2E: "1"
          AXIS_REQUIRE_BUILT_AXIS_PROXY_E2E: "1"
        run: bash e2e/linux/test_netns_helper_launch.sh

  test-windows:
    name: Test (Windows native)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      - name: Policy validation
        run: |
          .\target\release\axis.exe policy validate policies\minimal.yaml
          .\target\release\axis.exe policy validate policies\coding-agent.yaml
          .\target\release\axis.exe policy validate policies\gpu-agent.yaml

      - name: Agent policy validation
        run: |
          Get-ChildItem policies\agents\*.yaml | ForEach-Object {
            .\target\release\axis.exe policy validate $_.FullName
          }
        shell: pwsh

      - name: Agent safety tests
        run: powershell -ExecutionPolicy Bypass -File e2e\agents\test_agents.ps1 -AxisBin .\target\release\axis.exe
        shell: pwsh

      - name: Test agent install (PowerShell)
        run: |
          # Test axis install --list
          .\target\release\axis.exe install --list

          # Test install.ps1 syntax (parse check)
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content e2e\agents\install_agents.ps1 -Raw), [ref]$null
          )
          Write-Host "install_agents.ps1 syntax: OK"

          # Test install.ps1 runs with -List
          powershell -ExecutionPolicy Bypass -File e2e\agents\install_agents.ps1 -List

          # Test install aider (python available on GH runners)
          .\target\release\axis.exe install aider
          if (Test-Path "$env:LOCALAPPDATA\axis\bin\aider.cmd") {
            Write-Host "PASS: aider wrapper created"
          } else {
            Write-Host "FAIL: aider wrapper not found"
            exit 1
          }
        shell: pwsh
