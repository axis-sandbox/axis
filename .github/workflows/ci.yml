name: CI

on:
  push:
    branches: [main, develop, "users/**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.95.0
  MXC_REPOSITORY: https://github.com/microsoft/mxc
  MXC_REF: 1736b48398c3fe4d1315b2311c0951cc893eb3ae

jobs:
  # Format and clippy always run (fast, catch style issues on all changes).
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # Build and test jobs skip on docs-only changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'e2e/linux/**'
              - 'install.sh'
              - 'policies/**'
              - 'data/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/nightly.yml'

  test-linux:
    name: Test (Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux sandbox dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap python3

      - name: Build
        run: cargo build --release

      - name: Build MXC Linux executor
        timeout-minutes: 15
        run: |
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" target/release/lxc-exec

      - name: Security Tier 0/1 tests
        run: bash scripts/test_security_tier0.sh

      - name: Unit & integration tests
        run: cargo test

      - name: Seccomp notify connect attribution proof
        env:
          AXIS_TEST_SECCOMP_NOTIFY_ATTRIBUTION: "1"
        run: cargo test -p axis-sandbox gated_seccomp_notify_records_connecting_executable_before_fd_handoff_exec -- --nocapture

      - name: Standalone Linux e2e test
        run: bash e2e/linux/test_sandbox.sh ./target/release/axis

      - name: Policy validation
        run: |
          ./target/release/axis policy validate policies/minimal.yaml
          ./target/release/axis policy validate policies/coding-agent.yaml
          ./target/release/axis policy validate policies/gpu-agent.yaml

      - name: Linux MXC packaging contract
        run: bash scripts/check_linux_mxc_packaging.sh

      - name: Success metrics
        run: ./target/release/success-metrics

      - name: Daemon e2e test
        run: bash e2e/linux/test_e2e_daemon.sh

      - name: Agent safety tests
        env:
          AXIS_AGENT_TEST_RUNTIME_PROVIDER: axis_native
          AXIS_AGENT_TEST_DISABLE_RESOURCE_LIMITS: "1"
          AXIS_AGENT_TEST_NETWORK_MODE: block
        run: AXIS_BIN=./target/release/axis bash e2e/agents/test_agents.sh --platform linux

  test-linux-netns-helper:
    name: Test Linux netns helper
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - name: Install kernel namespace tooling
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap iproute2 iptables python3

      - name: Build MXC Linux executor
        timeout-minutes: 15
        run: |
          mkdir -p target/release
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" target/release/lxc-exec

      - name: Helper launch proof
        env:
          AXIS_RUN_PRIVILEGED_E2E: "1"
          AXIS_REQUIRE_BUILT_AXIS_PROXY_E2E: "1"
        run: bash e2e/linux/test_netns_helper_launch.sh

  test-windows:
    name: Test (Windows native)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Unit tests
        run: cargo test

      - name: Policy validation
        run: |
          .\target\release\axis.exe policy validate policies\minimal.yaml
          .\target\release\axis.exe policy validate policies\coding-agent.yaml
          .\target\release\axis.exe policy validate policies\gpu-agent.yaml

      - name: Agent policy validation
        run: |
          Get-ChildItem policies\agents\*.yaml | ForEach-Object {
            .\target\release\axis.exe policy validate $_.FullName
          }
        shell: pwsh

      - name: Agent safety tests
        run: powershell -ExecutionPolicy Bypass -File e2e\agents\test_agents.ps1 -AxisBin .\target\release\axis.exe
        shell: pwsh

      - name: Test agent install (PowerShell)
        run: |
          # Test axis install --list
          .\target\release\axis.exe install --list

          # Test install.ps1 syntax (parse check)
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content e2e\agents\install_agents.ps1 -Raw), [ref]$null
          )
          Write-Host "install_agents.ps1 syntax: OK"

          # Test install.ps1 runs with -List
          powershell -ExecutionPolicy Bypass -File e2e\agents\install_agents.ps1 -List

          # Test install aider (python available on GH runners)
          .\target\release\axis.exe install aider
          if (Test-Path "$env:LOCALAPPDATA\axis\bin\aider.cmd") {
            Write-Host "PASS: aider wrapper created"
          } else {
            Write-Host "FAIL: aider wrapper not found"
            exit 1
          }
        shell: pwsh
